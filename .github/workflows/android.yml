# Builds the Android app (a full-screen window onto the deployed demo) and publishes the APK
# as the GitHub release "android-latest". Run it from the Actions tab; you can give another link.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Link the app opens"
        required: false
        default: "https://www.modelscope.cn/studios/mechisbsv/job-agent"
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android
        run: |
          URL="${{ github.event.inputs.url }}"
          if [ -n "$URL" ]; then gradle assembleDebug -PappUrl="$URL"; else gradle assembleDebug; fi
          cp app/build/outputs/apk/debug/app-debug.apk ../JobAgent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JobAgent-apk
          path: JobAgent.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest JobAgent.apk --title "Job Agent for Android" \
            --notes "Download JobAgent.apk on your phone and open it to install (allow installing from this source once)."
