plugins { id "com.android.application" }

android {
    namespace "com.mechi.jobagent"
    compileSdk 34
    defaultConfig {
        applicationId "com.mechi.jobagent"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "APP_URL", "\"${project.findProperty('appUrl')}\""
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
